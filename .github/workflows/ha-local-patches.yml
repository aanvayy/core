name: Maintain tested HA patches
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the current stable release
        type: boolean
        default: false
      notify:
        description: Raise an owner attention issue if this manual run fails
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ha-local-patches
  cancel-in-progress: false
jobs:
  plan:
    name: Find pending release
    if: github.repository == 'aanvayy/core'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/ha-local-patches
      - name: Select the stable release
        id: plan
        run: python3 .github/ha-local-patches/pipeline.py plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
  build:
    name: Reconcile and test
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
          sparse-checkout: .github/ha-local-patches
      - name: Check the maintenance controller
        run: python3 -m unittest discover -s controller/.github/ha-local-patches -p test_pipeline.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintained/ha-release
          path: core
          fetch-depth: 50
          persist-credentials: false
      - name: Reconcile the maintained patches
        id: prepare
        run: python3 controller/.github/ha-local-patches/pipeline.py prepare --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          python-version: ${{ steps.prepare.outputs.python }}
          enable-cache: true
          cache-dependency-glob: |
            core/pyproject.toml
            core/requirements_test*.txt
            core/homeassistant/package_constraints.txt
            core/homeassistant/components/lg_infrared/manifest.json
            core/homeassistant/components/panasonic_viera/manifest.json
            core/homeassistant/components/homekit/manifest.json
      - name: Install focused test dependencies
        run: python3 controller/.github/ha-local-patches/pipeline.py install
      - name: Generate English translations
        working-directory: core
        run: .venv/bin/python -m script.translations develop --all
      - name: Check integration code
        working-directory: core
        run: |
          .venv/bin/ruff check homeassistant/components/lg_infrared homeassistant/components/panasonic_viera tests/components/lg_infrared tests/components/panasonic_viera
          .venv/bin/ruff format --check homeassistant/components/lg_infrared homeassistant/components/panasonic_viera tests/components/lg_infrared tests/components/panasonic_viera
          .venv/bin/mypy --follow-imports=silent homeassistant/components/lg_infrared homeassistant/components/panasonic_viera
          .venv/bin/python -m script.hassfest --integration-path homeassistant/components/lg_infrared
          .venv/bin/python -m script.hassfest --integration-path homeassistant/components/panasonic_viera
      - name: Run both upstream suites and feature regressions
        working-directory: core
        run: .venv/bin/python -m pytest -q --disable-warnings --timeout=60 --junitxml=../candidate/integrations.xml tests/components/lg_infrared tests/components/panasonic_viera
      - name: Check stock HomeKit TV compatibility
        working-directory: core
        run: .venv/bin/python -m pytest -q --disable-warnings --timeout=60 --junitxml=../candidate/homekit.xml tests/components/homekit/test_type_media_players.py
      - name: Check shared IR and Broadlink contracts
        working-directory: core
        run: .venv/bin/python -m pytest -q --disable-warnings --timeout=60 --junitxml=../candidate/transport.xml tests/components/infrared tests/components/broadlink/test_infrared.py tests/components/broadlink/test_remote.py
      - name: Build verified component packages
        run: python3 controller/.github/ha-local-patches/pipeline.py package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: tested-ha-local-components
          path: candidate/
          if-no-files-found: error
          retention-days: 90
  publish:
    name: Publish tested source
    needs: [plan, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Publish only the tested managed branch.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
          sparse-checkout: .github/ha-local-patches
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: core
          ref: maintained/ha-release
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-ha-local-components
          path: candidate
      - name: Publish the tested managed branch
        run: |
          git -C core config user.name 'github-actions[bot]'
          git -C core config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C core config credential.helper ''
          git -C core config --add credential.helper '!gh auth git-credential'
          python3 controller/.github/ha-local-patches/pipeline.py publish
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
  attention:
    name: Report attention
    needs: [plan, build, publish]
    if: ${{ always() && github.repository == 'aanvayy/core' && (github.event_name != 'workflow_dispatch' || inputs.notify) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # Assign owner attention issues; no upstream messages.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/ha-local-patches
      - name: Report only intervention or recovery
        run: python3 .github/ha-local-patches/pipeline.py notify --tag "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          JOB_RESULTS: '{"plan":"${{ needs.plan.result }}","build":"${{ needs.build.result }}","publish":"${{ needs.publish.result }}"}'
