name: IR upstream watch
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: ir-upstream-watch
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'aanvayy/core'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: .github/lg-infrared-watch
      - name: Compare reviewed upstream sources
        run: python3 .github/lg-infrared-watch/watch_upstream.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
